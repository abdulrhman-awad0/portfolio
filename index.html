<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محمد حسن الدسوقي | مدرب أول ومنسق برامج ومشروعات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#12313f;--mute:#4d6573;--line:#d5dee3;--navy:#12313f;--on:#f2f6f7;--gold:#e2a33b;--teal:#1f6f78;--soft:#e8f0f2;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a21;--card:#14262f;--ink:#e8eff2;--mute:#9db3be;--line:#27404c;--soft:#1a303a;--teal:#6cc0c9}}
:root[data-theme="dark"]{--bg:#0d1a21;--card:#14262f;--ink:#e8eff2;--mute:#9db3be;--line:#27404c;--soft:#1a303a;--teal:#6cc0c9}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.75;font-size:16px}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--on);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;margin-inline-end:auto;text-decoration:none;font-size:17px}
nav a.l{text-decoration:none;padding:6px 13px;border-radius:8px;font-size:15px;color:#c7d6dc}
nav a.l:hover{color:#fff}
nav a.l[aria-current="page"]{background:var(--gold);color:#12313f;font-weight:600}
.hero{background:var(--navy);color:var(--on);padding:52px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1fr 240px;gap:36px;align-items:center}
.hero h1{font-size:clamp(32px,5.5vw,54px);line-height:1.2;margin:0 0 8px}
.role{color:var(--gold);font-weight:600;font-size:clamp(17px,2.3vw,21px);margin:0 0 16px}
.lead{max-width:60ch;color:#d6e2e6;margin:0 0 22px}
.photo{width:240px;height:290px;border-radius:14px;border:3px solid var(--gold);background:#1d4556;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:700;color:var(--gold)}
.photo img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-block;text-decoration:none;padding:10px 20px;border-radius:9px;font-weight:600;border:2px solid var(--gold);margin:0 0 8px 10px}
.btn.fill{background:var(--gold);color:#12313f}
.btn.out{color:var(--on)}
main{padding-bottom:20px}
section{padding-top:46px}
h2{font-size:26px;line-height:1.35;margin:0 0 6px}
h3{margin:0}
.sub{color:var(--mute);margin:0 0 22px;max-width:70ch}
.pgh{background:var(--navy);color:var(--on);padding:38px 0}
.pgh h1{margin:0 0 4px;font-size:clamp(28px,4.5vw,40px)}
.pgh p{margin:0;color:#c7d6dc;max-width:68ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stat{padding:16px 20px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat strong{display:block;font-size:29px;line-height:1.2;color:var(--teal)}
.stat span{font-size:14px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.go{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--teal);border-radius:12px;padding:22px 24px}
.go.m{border-top-color:var(--gold)}
.go h3{font-size:22px;margin-bottom:6px}
.go p{margin:0 0 10px;color:var(--mute)}
.go b{color:var(--teal)}
.go:hover{border-color:var(--teal)}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--teal);border-radius:10px;padding:15px 20px;margin-bottom:12px}
.mg .item{border-inline-start-color:var(--gold)}
.item h3{font-size:18px;line-height:1.5}
.meta{font-size:14px;color:var(--mute);margin:2px 0 6px}
.item p{margin:0;font-size:15.5px}
.grp{font-size:20px;margin:30px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.box h3{font-size:19px;margin-bottom:10px}
.box ul{margin:0;padding:0 18px 0 0}
.box li{margin-bottom:6px}
.box p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chips li{background:var(--soft);border-radius:999px;padding:4px 14px;font-size:14.5px}
.cc{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cc:hover{border-color:var(--gold)}
.ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700}
.cc small{display:block;color:var(--mute)}
.cc strong{direction:ltr;unicode-bidi:plaintext;display:block}
footer{margin-top:50px;background:var(--navy);color:#b9cbd2;padding:24px 0;text-align:center;font-size:14px}
@media (max-width:720px){.hero .wrap{grid-template-columns:1fr}.photo{order:-1;width:170px;height:200px;font-size:52px}.two{grid-template-columns:1fr}.stat{border-inline-start:0;border-top:1px solid var(--line)}.stat:first-child{border-top:0}}
</style>
</head>
